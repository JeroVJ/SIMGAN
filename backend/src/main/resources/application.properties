server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/simgan_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===== Planet Labs API =====
# Pon tu API Key aqui (Education License)
planet.api.key=
planet.api.base-url=https://api.planet.com/data/v1

# Item type: PSScene (PlanetScope 3-5m daily)
planet.item-type=PSScene

# Asset type: ortho_analytic_4b_sr (Surface Reflectance, 4-band)
planet.asset-type=ortho_analytic_4b_sr

# ===== NDVI Config =====
# Umbral minimo de NDVI para alerta (pasto degradado)
ndvi.alert.threshold=0.3

# Umbral optimo de NDVI (pasto saludable, listo para pastoreo)
ndvi.optimal.threshold=0.6

# Dias de descanso recomendados cuando NDVI < threshold
ndvi.rest.days=21

# ===== Seed Data =====
# Generar datos demo al iniciar (true/false)
ndvi.seed.enabled=false

# Meses de datos historicos a generar
ndvi.seed.months=6

# Directorio temporal para descargas de GeoTIFF
planet.download.dir=${java.io.tmpdir}/simgan-planet

# ===== Sentinel-2 / Copernicus (GRATUITO) =====
# Token de acceso de Copernicus Data Space (opcional para búsqueda, requerido para descarga)
# Crear cuenta gratuita en: https://dataspace.copernicus.eu
sentinel.access.token=YOUR_SENTINEL_TOKEN_HERE

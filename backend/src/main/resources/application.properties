server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
app.base-url=${APP_BASE_URL:http://localhost:5173}

# ===== Email =====
# Preferred transport: Brevo HTTP API (works on Railway, which blocks SMTP ports).
# Set BREVO_API_KEY in production to enable real email delivery. When empty, the
# app falls back to SMTP below (useful for local dev only).
brevo.api-key=${BREVO_API_KEY:}

# ===== Email / SMTP (Gmail) — local-dev fallback only =====
# Note: Railway blocks outbound SMTP (25/465/587), so SMTP will time out there.
# Use BREVO_API_KEY in production. SMTP stays for local testing.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.host=${MAIL_HOST:smtp.gmail.com}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.protocol=${MAIL_PROTOCOL:smtp}
app.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
app.mail.smtp.starttls-enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.smtp.connection-timeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
app.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
app.mail.smtp.write-timeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
spring.mail.from=${MAIL_FROM:SIMGAN <no-reply@simgan.local>}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/simgan_db}
spring.datasource.username=${DB_USERNAME:simgan}
spring.datasource.password=${DB_PASSWORD:simgan123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# SQL logging off by default — it floods Railway's log limit (500 logs/sec) and
# drops important lines (e.g. email send results). Set JPA_SHOW_SQL=true to debug.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# ===== JWT =====
jwt.secret=${JWT_SECRET:mySecretKeyForJwtTokenGenerationThatIsLongEnough}

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===== Planet Labs API =====
planet.api.key=${PLANET_API_KEY:}
planet.api.base-url=${PLANET_BASE_URL:https://api.planet.com}
planet.item-type=${PLANET_ITEM_TYPE:PSScene}
planet.asset-type=${PLANET_ASSET_TYPE:ortho_analytic_4b_sr}
planet.activation.poll-enabled=${PLANET_ACTIVATION_POLL_ENABLED:true}
planet.activation.max-wait-seconds=${PLANET_ACTIVATION_MAX_WAIT_SECONDS:120}
planet.activation.poll-interval-millis=${PLANET_ACTIVATION_POLL_INTERVAL_MILLIS:2000}

# ===== NDVI Config =====
ndvi.alert.threshold=${NDVI_ALERT_THRESHOLD:0.1}
ndvi.optimal.threshold=${NDVI_OPTIMAL_THRESHOLD:0.6}
ndvi.rest.days=${NDVI_REST_DAYS:30}

# Directorio temporal para descargas de GeoTIFF
planet.download.dir=${PLANET_DOWNLOAD_DIR:/tmp/simgan-downloads}

# ===== Copernicus =====
copernicus.username=${COPERNICUS_USERNAME:}
copernicus.password=${COPERNICUS_PASSWORD:}

# ===== Sentinel Hub =====
sentinel.hub.client.id=${SENTINEL_HUB_CLIENT_ID:}
sentinel.hub.client.secret=${SENTINEL_HUB_CLIENT_SECRET:}

# ===== Servicio externo de procesamiento NDVI =====
image.processing.base-url=${IMAGE_PROCESSING_BASE_URL:http://localhost:8082/api}
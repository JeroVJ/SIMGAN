server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===== Planet Labs API =====
planet.api.key=${PLANET_API_KEY}
planet.api.base-url=${PLANET_BASE_URL}
planet.item-type=${PLANET_ITEM_TYPE}
planet.asset-type=${PLANET_ASSET_TYPE}
planet.activation.poll-enabled=${PLANET_ACTIVATION_POLL_ENABLED:true}
planet.activation.max-wait-seconds=${PLANET_ACTIVATION_MAX_WAIT_SECONDS:120}
planet.activation.poll-interval-millis=${PLANET_ACTIVATION_POLL_INTERVAL_MILLIS:2000}

# ===== NDVI Config =====
ndvi.alert.threshold=${NDVI_ALERT_THRESHOLD}
ndvi.optimal.threshold=${NDVI_OPTIMAL_THRESHOLD}
ndvi.rest.days=${NDVI_REST_DAYS}



# Directorio temporal para descargas de GeoTIFF
planet.download.dir=${PLANET_DOWNLOAD_DIR}

# ===== Copernicus =====
copernicus.username=${COPERNICUS_USERNAME}
copernicus.password=${COPERNICUS_PASSWORD}

# ===== Sentinel Hub =====
sentinel.hub.client.id=${SENTINEL_HUB_CLIENT_ID}
sentinel.hub.client.secret=${SENTINEL_HUB_CLIENT_SECRET}

# ===== Servicio externo de procesamiento NDVI =====
image.processing.base-url=${IMAGE_PROCESSING_BASE_URL:http://localhost:8082/api}
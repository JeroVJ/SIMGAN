version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: simgan-postgres
    environment:
      POSTGRES_DB: simgan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - simgan_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  simgan_data:
